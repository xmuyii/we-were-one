# Nixpacks configuration for Railway
# Explicitly pins Node.js 22 LTS to resolve the Node 18 EOL removal error

[variables]
NIXPACKS_NODE_VERSION = "22"
NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node dist/server.cjs"
